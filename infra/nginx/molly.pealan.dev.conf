# ============================================================================
# molly.pealan.dev — nginx vhost (canonical, version-controlled copy)
#
# This is the HTTP (port 80) template. It mirrors what
# scripts/server-provision.sh prints in its "next steps", and is the source of
# truth for the cache policy below.
#
# `certbot --nginx` later AUGMENTS the live copy in
# /etc/nginx/sites-available/molly.pealan.dev with the 443 listener, the
# Let's Encrypt cert paths, and a HTTP->HTTPS 301 redirect. Those lines are
# machine-generated and host-specific, so they are intentionally NOT tracked
# here. After certbot runs, the `location /` block below lives inside the
# generated 443 server block — which is exactly where it needs to be, since
# that's where real content is served.
#
# ----------------------------------------------------------------------------
# Cache policy — why `no-cache`
# ----------------------------------------------------------------------------
# The static bundle is NOT content-fingerprinted: filenames like functions.js
# and jogo-01.html stay constant across deploys. That means we cannot safely
# cache any asset "forever" — a stable URL with a long max-age would serve
# stale bytes after the next rsync.
#
# Without an explicit Cache-Control, nginx sends only ETag + Last-Modified, and
# browsers fall back to HEURISTIC freshness (RFC 9111 sec 4.2.2): they treat a
# file as fresh for ~10% of its age since Last-Modified, serving it from cache
# WITHOUT revalidating. For a file untouched for days that's many hours of
# stale content — which is why a deploy used to need a Ctrl+F5 to show up.
#
# `Cache-Control: no-cache` does NOT mean "don't cache". It means "you may
# store it, but you MUST revalidate before reuse". Paired with the ETag nginx
# already emits, every request becomes a conditional GET: unchanged files
# return 304 (no body, cheap) and a fresh deploy is visible on the very next
# normal reload. No hard refresh, and there's no CDN in front to purge.
#
# If the bundle ever gains fingerprinted assets (functions.<hash>.js), split
# this policy: serve hashed assets `public, max-age=31536000, immutable` and
# keep HTML on `no-cache`. See DEPLOY.md and WORK_DIARY.md (2026-05-28).
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name molly.pealan.dev;
    root /var/www/molly.pealan.dev;
    index index.html;

    # Security headers (security-headers.conf in this directory). Also needs
    # `server_tokens off;` in the http block of /etc/nginx/nginx.conf.
    include snippets/molly-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
        # Revalidate every response via ETag — see header comment above.
        add_header Cache-Control "no-cache" always;
        # Re-include: a location with its own add_header inherits none.
        include snippets/molly-security-headers.conf;
    }
}
