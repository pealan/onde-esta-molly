# molly.pealan.dev — security response headers.
# Install as /etc/nginx/snippets/molly-security-headers.conf and `include` it
# in the server block AND in every location that has its own add_header
# (nginx drops inherited add_header lines as soon as a block declares one).
#
# CSP notes: the 2012-era game pages rely on inline <script> and eval(), so
# script-src must keep 'unsafe-inline' 'unsafe-eval'. What the policy still
# buys: nothing loads from, posts to, or is framed by another origin.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
